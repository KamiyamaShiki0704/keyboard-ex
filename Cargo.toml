[workspace]
resolver = "2"
members = ["examples/keyboard-ex"]
default-members = ["examples/keyboard-ex"]

[workspace.package]
version = "0.14.0"
edition = "2024"
repository = "https://github.com/KamiyamaShiki0704/keyboard_ex"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shikifsrs-runtime = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "fb9f4524da1fb648e0a696f2d47aa08d3acf35cc" }
shikifsrs-elden-ring = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "fb9f4524da1fb648e0a696f2d47aa08d3acf35cc" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
